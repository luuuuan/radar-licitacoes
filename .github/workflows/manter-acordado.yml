name: Manter o Render acordado (horário comercial)

# DESATIVADO (2026-10): este ping existia pro cold start do plano FREE do
# Render, que "dormia" após 15 min sem acesso. O app migrou pra Railway (ver
# render.yaml) -- confirmado com o usuário que o plano da Railway usado hoje
# fica sempre ativo, não dorme por inatividade. Mantido aqui comentado (não
# apagado), mesmo padrão já usado em coleta-diaria.yml, caso o app volte a
# rodar em algo que precise disso; workflow_dispatch continua ativo pra
# disparo manual se precisar testar.
#
# Usa a Variable RENDER_URL (Settings → Secrets and variables → Actions → Variables).

on:
  # schedule:
  #   # A cada 10 min, somente nas horas 10–22 UTC (= 07h–19h de Brasília).
  #   - cron: "*/10 10-22 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health para evitar o cold start
        run: |
          URL="${{ vars.RENDER_URL }}"
          if [ -z "$URL" ]; then
            echo "RENDER_URL não configurada — pulando."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "${URL%/}/health")
          echo "Ping /health: HTTP $code"
          # não falha o workflow se o ping não responder (evita ruído de alertas)
          exit 0
