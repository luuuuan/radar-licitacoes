name: Coleta automática de licitações


on:
  # schedule desativado (2026-10): a coleta diária agora é disparada por
  # Cron Jobs nativos da Railway, no mesmo projeto do app -- mesma rota
  # /api/coletar-cron, só muda quem chama. Mantido aqui comentado (não
  # apagado) como plano B, e workflow_dispatch continua ativo pra disparo
  # manual se precisar.
  # schedule:
  #   # Horários em UTC. Brasília = UTC-3.
  #   - cron: "0 6 * * *"
  #   - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  disparar-coleta:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar coleta em produção
        run: |
          # RENDER_URL: nome histórico da variável (app rodava no Render até
          # 2026-09; migrou pra Railway) -- mantido como está pra não exigir
          # renomear a variável no painel do GitHub junto com este commit.
          # Guarda a URL de produção atual (Railway), seja qual for o nome.
          URL="${{ vars.RENDER_URL }}"
          if [ -z "$URL" ]; then
            echo "⚠ Defina a variável RENDER_URL (Settings → Secrets and variables → Actions → Variables) com a URL de produção"
            exit 1
          fi
          code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" --max-time 120 \
            -X POST "${URL%/}/api/coletar-cron" \
            -H "X-Cron-Key: ${{ secrets.CRON_SECRET }}")
          echo "Resposta: HTTP $code"
          cat /tmp/resp.txt; echo
          # 200 = coleta iniciada. A coleta em si roda em segundo plano no servidor.
          if [ "$code" != "200" ]; then
            echo "Falha ao disparar a coleta (verifique RENDER_URL e CRON_SECRET)."
            exit 1
          fi
