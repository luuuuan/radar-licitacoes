# Achado real (auditoria de arquitetura pedida pelo usuário, 2026-10): este
# compose chegou a ter serviços `redis`/`worker`/`beat` rodando
# `celery -A app.celery_app.celery` -- um plano de arquitetura que nunca foi
# implementado (não existe app/celery_app.py nem app/tasks.py, `celery` nunca
# esteve em requirements.txt). Esses 3 serviços morriam com ModuleNotFoundError
# no primeiro start; removidos. A coleta diária de verdade é um Cron Job
# nativo da Railway chamando POST /api/coletar-cron (ver
# .github/workflows/coleta-diaria.yml) -- não tem fila nem worker separado,
# tudo roda em BackgroundTasks dentro do próprio processo da API. Este
# compose serve só pra subir Postgres+pgvector e a API localmente.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: radar
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  pgdata:
